server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flowmind_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
      connect-timeout: 300ms
  jackson:
    time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
flowmind:
  jwt:
    secret: ${JWT_SECRET:flowmind-local-development-secret-change-before-deployment-2026}
    expiration-ms: 7200000
  redis-enabled: ${REDIS_ENABLED:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc:
  swagger-ui:
    path: /doc.html
